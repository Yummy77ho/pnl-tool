<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日业绩归因</title><link rel="stylesheet" href="styles.css"></head><body><main><header><h1>每日业绩归因生成器</h1><p>本地浏览器计算 · 文件不会上传</p></header><section class="card"><h2>1. 导入文件</h2><div class="grid"><label>T-1日估值表<input id="prev" type="file" accept=".xls,.xlsx"></label><label>T日估值表<input id="today" type="file" accept=".xls,.xlsx"></label><label>T日成交记录<input id="trades" type="file" accept=".xlsx,.xls"></label></div><button id="run">计算归因</button><p id="status"></p></section><section class="card"><h2>2. 资产分类</h2><p>可编辑代码对应分类；支持上传后的持仓自动归类。</p><div id="mapping"></div></section><section class="card"><h2>3. 每日盈亏</h2><div class="actions"><button id="copy">复制为表格</button><button id="export">下载 Excel</button></div><div class="tablewrap"><table><thead><tr><th>资产类别</th><th>持仓盈亏</th><th>买入成交盈亏</th><th>卖出成交盈亏</th><th>合计</th></tr></thead><tbody id="result"><tr><td colspan="5">请先导入文件</td></tr></tbody></table></div><textarea id="paste" placeholder="复制后的 TSV，可粘贴到 Excel"></textarea></section><footer>静态本地网页 · Excel 文件在您的浏览器中解析</footer></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="app.js"></script></body></html>
